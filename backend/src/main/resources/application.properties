spring.config.import=optional:file:.env[.properties]
# ---------------------------------------------------------------- server
server.port=${PORT:8080}
server.address=0.0.0.0

# ---------------------------------------------------------------- database
# MongoDB is the source of truth. Point MONGODB_URI at your cluster (Atlas, Render, a local
# instance, whatever you run); the default only exists so that a fresh checkout starts locally
# without any configuration at all.
spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# ---------------------------------------------------------------- web / cors
# The single origin allowed to call this API from a browser.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ---------------------------------------------------------------- AI layer (free Google Gemini tier)
# Leave the key empty and the whole application still works: recommendations, validation and the
# chat assistant are computed by the deterministic engine, and the AI only adds ranking + prose.
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:12}
# Free tier for gemini-2.5-flash-lite is around 15 requests/minute; stay under it on purpose.
app.gemini.max-calls-per-minute=${GEMINI_MAX_CALLS_PER_MINUTE:10}
# After two failures in a row the AI layer rests for this long instead of hammering the quota.
app.gemini.failure-cooldown-seconds=${GEMINI_FAILURE_COOLDOWN_SECONDS:60}

# ---------------------------------------------------------------- demo data
# Startup behaviour (see DataSeeder): the four warehouses are always ensured, an empty database is
# filled with the demo network, and legacy documents are migrated onto WH-A instead of being dropped.
# Set app.demo.reset=true (or SEED_RESET=true) to wipe the operational collections and reload the
# four-warehouse demo network. Only do that with throwaway data.
app.demo.reset=${SEED_RESET:false}

# ---------------------------------------------------------------- logging
logging.level.org.mongodb.driver=warn
logging.level.com.example.linehaul=info
